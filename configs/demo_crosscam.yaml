# Cross-camera ReID demo config (used by crosscam_split_demo).
#
# Detection + BYTETrack per view, OSNet ReID enabled, and the
# cross-camera IdentityMatcher on. Each frame of the source clip is
# split into a left and a right view; a person crossing from one into
# the other is re-identified and keeps the same global id.
#
#   ./build/crosscam_split_demo --config configs/demo_crosscam.yaml \
#       --cameras configs/demo_crosscam_cameras.yaml \
#       --input walk.mp4 --output crosscam.mp4

pipeline:
  muxer_width: 384
  muxer_height: 576
  batch_size: 1
  emit_overlay: true

detection:
  engine_path: "models/engines/yolo11x_person_fp16.engine"
  input_width: 1280
  input_height: 1280
  confidence_threshold: 0.25
  nms_iou_threshold: 0.5
  person_class_id: 0

tracker:
  type: "bytetrack"
  bytetrack:
    high_thresh: 0.35
    low_thresh: 0.1
    new_track_thresh: 0.3
    track_buffer: 30
    match_thresh: 0.8
    aspect_ratio_thresh: 3.0

reid:
  enabled: true
  engine_path: "models/engines/osnet_x0_25_fp16.engine"   # OSNet x0_25, 512-d
  input_width: 128
  input_height: 256
  embedding_dim: 512
  batch_size: 16
  gallery_size_per_track: 8

crosscam:
  enabled: true
  reid_threshold: 0.55          # cosine similarity floor to link views
  spatial_overlap_window_ms: 8000
  hungarian_cost_cap: 0.6

logging:
  level: "info"
  json: false
