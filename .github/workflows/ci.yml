name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# GitHub-hosted runners carry neither CUDA nor TensorRT, so the full
# build cannot run here. CI covers what it honestly can: formatting, static
# analysis, and the CPU-only algorithmic core with its unit tests. Build the
# GPU pipeline locally or through docker/Dockerfile.

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src include tools tests \
               \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # The CUDA / TensorRT headers are absent on the runner, hence the
      # include suppressions; everything else is an error.
      #
      # tests/ is deliberately not analysed here: without GoogleTest's
      # headers cppcheck cannot parse the TEST() macro and reports a
      # syntaxError for every case. The format job does cover tests/.
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance \
                   --error-exitcode=1 \
                   --inline-suppr \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=useStlAlgorithm \
                   --std=c++17 \
                   src include tools

  unit-tests:
    name: CPU-only unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libeigen3-dev libyaml-cpp-dev libopencv-dev libspdlog-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DMCT_CPU_ONLY=ON \
                -DMCT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
